[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["unifiedkappa"]

[tool.setuptools.dynamic]
version = {attr = "unifiedkappa.__version__"}

[project]
name = "unifiedkappa"
description = "Diagonal and off-diagonal (coherence) lattice thermal conductivity from phonopy and ShengBTE"
dynamic = ["version"]
readme = {file = "README.md", content-type = "text/markdown"}
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Dale Gaines II", email = "dalegainesii@gmail.com"},
    {name = "Yi Xia"},
]
maintainers = [{name = "Dale Gaines II", email = "dalegainesii@gmail.com"}]
keywords = ["phonons", "thermal conductivity", "wigner transport", "phonopy", "shengbte"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22",
    "phonopy>=4.8,<5",
    "f90nml",
]

[project.optional-dependencies]
plot = [
    "matplotlib",
]
dev = [
    "coverage",
    "matplotlib",
    "pre-commit",
    "pytest",
    "ruff",
]

[project.urls]
repository = "https://github.com/dgaines2/Unifiedkappa"

[tool.ruff]
target-version = "py311"
line-length = 90
exclude = ["unifiedkappa/experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E203", "E231"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["unifiedkappa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: regression tests that run full q-point meshes (deselect with -m 'not slow')",
]

[tool.coverage.run]
command_line = "-m pytest"
source = ["unifiedkappa"]
omit = ["unifiedkappa/experiments/*"]
